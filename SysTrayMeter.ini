; SysTrayMeter -- Configuration example
; Original color configuration retained. See README_zh-CN.md.

; Global settings
[Settings]
; Refresh interval: 250..60000 milliseconds
UpdateIntervalMs=1000
; CPU: 0=Processor Utility (default), 1=Processor Time
CpuMetric=0

; sections order: 0=small/big; 1=big/small
ReverseOrder=0

; info in section: 0=CPU/RAM; 1=RAM/CPU
InfoSection=0

; how to show RAM: 0=nothing; 1=free ram; 2=used ram
ShowUsedRam=1

; how to show CPU: 0=noting; 1=free%; 2=used%
ShowCpu=2



; This will change the colors used for CPU usage.
; To affect the ones for RAM usage, use the same settings but under [RamColors]
[CpuColors]
; This will have a text in black on white background under 50%, and white on red background from 50% to 100%
NbText=2
Text1.MaxValue=50
Text1.Color=#000000
Text2.MaxValue=100
Text2.Color=#FFFFFF
NbBack=2
Back1.MaxValue=50
Back1.Color=#FFFFFF
Back2.MaxValue=100
Back2.Color=#FF0000

[RamColors]

NbText=3
Text1.MaxValue=60
Text1.Color=#000000
Text2.MaxValue=80
Text2.Color=#000000
Text3.MaxValue=100
Text3.Color=#FFFFFF
NbBack=3
Back1.MaxValue=60
Back1.Color=#008000
Back2.MaxValue=80
Back2.Color=#008000
Back3.MaxValue=100
Back3.Color=#000000
